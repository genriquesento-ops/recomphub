<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Conquista</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.35 "Segoe UI", system-ui, sans-serif; }
    .card {
      position: absolute; right: 10px; bottom: 10px; width: 396px; box-sizing: border-box;
      display: flex; gap: 14px; align-items: center; padding: 14px 16px;
      background: rgba(18, 20, 26, .94); color: #e8eaef; border: 1px solid #2a2f3a; border-left: 4px solid #e0a32e;
      border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
      transform: translateY(140%); opacity: 0; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2), opacity .25s;
    }
    .card.show { transform: translateY(0); opacity: 1; }
    .card.complete { border-left-color: #4cc38a; }
    .badge { flex: none; width: 56px; height: 56px; border-radius: 12px; background: #1f232c; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .k { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: #e0a32e; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .t, .d { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .complete .k { color: #4cc38a; }
    .t { font-size: 16px; font-weight: 700; margin: 2px 0; }
    .d { color: #9aa1ae; font-size: 12.5px; }
    .p { margin-left: auto; align-self: flex-start; color: #e0a32e; font-weight: 700; font-size: 13px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="overlay.js"></script>
</body>
</html>
