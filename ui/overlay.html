<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Conquista</title>
  <style>
    @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.35 "Segoe UI", system-ui, sans-serif; }
    .card {
      position: absolute; right: 10px; bottom: 10px; width: 396px; box-sizing: border-box;
      display: flex; gap: 14px; align-items: center; padding: 14px 16px;
      background: #13110f; color: #ece6da; border: 1px solid #d9d2c4; border-left: 5px solid #e2482b;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, .55);
      transform: translateY(140%); opacity: 0; transition: transform .3s cubic-bezier(.2, .8, .3, 1), opacity .2s;
    }
    .card.show { transform: translateY(0); opacity: 1; }
    .card.complete { border-left-color: #7cbf8e; }
    .badge { flex: none; width: 56px; height: 56px; background: #24211d; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .k { font: 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; color: #e2482b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .t, .d { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .complete .k { color: #7cbf8e; }
    .t { font-family: "Archivo", "Arial Black", sans-serif; font-stretch: 112%; font-size: 16px; font-weight: 800; margin: 3px 0 2px; }
    .d { color: #9a9286; font-size: 12.5px; }
    .p { margin-left: auto; align-self: flex-start; color: #ece6da; font: 600 12px ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="overlay.js"></script>
</body>
</html>
