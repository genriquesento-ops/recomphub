<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>FPS</title>
  <style>
    @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .fps {
      position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 6px;
      padding: 6px 10px 5px; background: rgba(19, 17, 15, .82); color: #ece6da;
      border-left: 4px solid #e2482b; font: 800 26px/1 "Archivo", "Arial Black", sans-serif; font-stretch: 112%;
      font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    }
    .fps small { font: 600 11px ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; color: #e2482b; }
    .fps.low { border-left-color: #d8a646; }
    .fps.low small { color: #d8a646; }
  </style>
</head>
<body>
  <div class="fps" id="fps">–<small>FPS</small></div>
  <script src="fps.js"></script>
</body>
</html>
