<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecompHUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Recomp<span>HUB</span></div>
    <div class="actions">
      <button id="btn-tv" class="ghost" title="Biblioteca em tela cheia, com controle ou teclado">Modo TV</button>
      <button id="btn-covers" class="ghost">Capas</button>
      <button id="btn-backup" class="ghost">Backup dos saves</button>
      <button id="btn-updates" class="ghost">Verificar atualizações</button>
      <button id="btn-add-pc">Adicionar jogo de PC</button>
      <button id="btn-add" class="primary">Adicionar port</button>
      <button id="btn-settings" class="ghost" title="Configurações">⚙</button>
    </div>
  </header>
  <div id="app-update" class="app-update" hidden></div>
  <div id="tv" class="tv" hidden></div>

  <main>
    <section id="library">
      <h1>Biblioteca</h1>
      <div class="tabs" id="tabs">
        <button data-tab="all">Todos</button>
        <button data-tab="port">Ports</button>
        <button data-tab="pc_game">Outros jogos de PC</button>
        <button data-tab="discover">Descobrir</button>
        <input type="search" id="search" placeholder="Buscar por nome, port ou etiqueta">
      </div>
      <div class="tagbar" id="tagbar"></div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted" hidden></p>
    </section>

    <section id="detail" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
